<!DOCTYPE html>
<!--
  أَثَر — ATHAR · سِجِلّك اليومي
  ─────────────────────────────────────────────────────────────
  ملف واحد، بلا مكتبات، بلا شبكة، بلا صور خارجية.
  • التخزين: localStorage (مفتاح athar.v1) + نسخة أمان (athar.v1.bak)
             كتابة مؤجلة 280ms لتقليل عمليات القرص = بطارية أقل.
  • الأيقونات: SVG مونوكروم مرسومة يدويًا داخل ICONS{} (تقدّم واحد).
  • الحركة: انتقالات CSS قصيرة (140–340ms) + رسم SVG مرة واحدة.
             ولا أي حلقة حركة دائمة، عدا نبضة "الآن" في مشهد اليوم
             وتُعطّل من الإعدادات (الحركة المخفّضة).
  • البنية:
      ١) المتغيّرات والأنماط (الوضع الداكن/الفاتح عبر data-theme)
      ٢) التخزين والحالة الافتراضية DEF()
      ٣) الحسابات الصحية: BMR / TDEE / BMI / الأهداف GOALS
      ٤) الأيقونات ICONS
      ٥) التنبيهات، اللوحات المنسدلة sheet، التنقل السفلي
      ٦) الشاشات: viewToday / viewBody / viewPlan / viewTrend / viewMe
      ٧) محرّك الإشعارات الذاتية selfCheck()
      ٨) موزّع الأحداث (data-act) — كل التفاعل من نقطة واحدة
      ٩) التشغيل: applyTheme, render, maybeOnboard, المؤقتات
  • البيانات اليومية في DB.days['YYYY-MM-DD'] = {water,steps,sleep,cal,mood,tasks}
-->
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a09">
<meta name="description" content="أَثَر — سجلّك اليومي للحركة والصحة والمهام. يعمل دون إنترنت ويحفظ كل شيء على جهازك.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="أَثَر">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>أَثَر — سجلّك اليومي</title>
<style>
/* ============ الأساس ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --font-body:"SF Arabic","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic","Noto Kufi Arabic",Tahoma,sans-serif;
  --font-title:"Iowan Old Style","Palatino Linotype",Georgia,"Amiri",serif;
  --fsm:1;
  --bg:#0a0a09; --surface:#111110; --surface2:#191918; --surface3:#232322;
  --line:rgba(241,239,233,.14); --line2:rgba(241,239,233,.07);
  --ink:#f1efe9; --muted:#8e8c85; --dim:#615f5a;
  --dot:rgba(241,239,233,.045);
  --good:#f1efe9;
  --r:20px; --ease:cubic-bezier(.22,.61,.36,1); --t:260ms;
  color-scheme:dark;
}
[data-calm="1"] *{animation-iteration-count:1!important}
[data-calm="1"] .pulse{animation:none!important}
[data-theme="light"]{
  --bg:#f4f2ec; --surface:#fbfaf6; --surface2:#eeebe3; --surface3:#e4e0d6;
  --line:rgba(16,15,14,.16); --line2:rgba(16,15,14,.08);
  --ink:#111110; --muted:#6b6963; --dim:#a3a099;
  --dot:rgba(16,15,14,.055);
  color-scheme:light;
}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  font-family:var(--font-body);font-size:calc(15px * var(--fsm));overflow-x:hidden;
  background:var(--bg);color:var(--ink);min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  background-image:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 0);
  background-size:24px 24px;
  transition:background-color var(--t) var(--ease),color var(--t) var(--ease);
}
body.lock{overflow:hidden}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:-.02em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--ink);color:var(--bg)}

/* ============ الهيدر ============ */
.top{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 16px 0;
}
.top-row{display:flex;align-items:center;gap:9px;padding-bottom:10px}
.top-meta .d,.top-meta .w{white-space:nowrap}
.brand span{white-space:nowrap}
@media (max-width:430px){
  .brand span{display:none}
  .brand b{font-size:19px}
  .mark{display:none}
  .top-row{gap:8px}
  .top-meta .d{font-size:11.5px}
  .top-meta .w{font-size:9.5px}
  .toasts{bottom:calc(80px + env(safe-area-inset-bottom))}
}
@media (max-width:430px){
  .top-row{gap:7px}
  .mark{width:34px;height:34px;flex:0 0 34px}
  .brand b{font-size:20px}
  .brand span{font-size:9px;letter-spacing:.1em}
  .top-meta .d{font-size:11px}
  .top-meta .w{font-size:9px}
  .icon-btn{width:34px;height:34px;flex:0 0 34px}
  .icon-btn svg{width:16px;height:16px}
}
.mark{
  width:38px;height:38px;flex:0 0 38px;border-radius:50%;
  border:1px solid var(--line);display:grid;place-items:center;position:relative;
}
.mark svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round}
.mark .ring{animation:spinOnce 1.2s var(--ease) both}
@keyframes spinOnce{from{transform:rotate(-120deg);opacity:0}to{transform:rotate(0);opacity:1}}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{
  font-family:"Iowan Old Style","Palatino Linotype",Georgia,"Amiri",serif;
  font-size:23px;font-weight:600;letter-spacing:.01em;
}
.brand span{font-size:10.5px;color:var(--muted);letter-spacing:.16em;margin-top:5px}
.top-meta{margin-inline-start:auto;text-align:end;line-height:1.25;min-width:0}
.top-meta .d{overflow:hidden;text-overflow:ellipsis}
.top-meta .d{font-size:12px;letter-spacing:.02em}
.top-meta .w{font-size:10px;color:var(--muted);letter-spacing:.1em;margin-top:3px}
.icon-btn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;transition:transform 140ms var(--ease),background-color 180ms;
}
.icon-btn:active{transform:scale(.9);background:var(--surface2)}
.icon-btn svg{width:18px;height:18px}
.dayline{height:2px;background:var(--line2);position:relative;overflow:hidden;margin:0 -16px}
.dayline i{position:absolute;inset:0;background:var(--ink);transform-origin:right center;transform:scaleX(0);transition:transform 1s linear;opacity:.55}

/* ============ الأيقونات ============ */
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block;overflow:visible}
svg.ic.lg{width:24px;height:24px;stroke-width:1.5}
svg.ic.sm{width:16px;height:16px;stroke-width:1.7}
.draw :is(path,circle,line,rect,polyline,ellipse){stroke-dasharray:1 1;stroke-dashoffset:1;animation:drawIn .55s var(--ease) forwards}
.draw :is(path,circle,line,rect,polyline,ellipse):nth-child(2){animation-delay:.07s}
.draw :is(path,circle,line,rect,polyline,ellipse):nth-child(3){animation-delay:.14s}
.draw :is(path,circle,line,rect,polyline,ellipse):nth-child(4){animation-delay:.2s}
@keyframes drawIn{to{stroke-dashoffset:0}}

/* ============ الهيكل ============ */
.wrap{max-width:720px;margin:0 auto;padding:14px 14px calc(122px + env(safe-area-inset-bottom))}
.screen{animation:enter 280ms var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px;position:relative;overflow:hidden;
}
.card + .card{margin-top:12px}
.card.tick::before,.card.tick::after{
  content:'';position:absolute;width:9px;height:9px;border:1px solid var(--line);
  pointer-events:none;
}
.card.tick::before{top:7px;inset-inline-end:7px;border-width:1px 1px 0 0}
.card.tick::after{bottom:7px;inset-inline-start:7px;border-width:0 0 1px 1px}
.h{font-size:10.5px;letter-spacing:.18em;color:var(--muted);margin:0 0 12px;font-weight:600}
.h + .h{margin-top:0}
.rowline{display:flex;align-items:center;gap:10px}
.spacer{margin-inline-start:auto}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.tiny{font-size:11px;letter-spacing:.04em}
.sep{height:1px;background:var(--line2);margin:12px 0}

/* ============ الأزرار ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:44px;padding:0 16px;border-radius:14px;
  border:1px solid var(--line);background:var(--surface2);color:var(--ink);
  font-size:13.5px;font-weight:600;letter-spacing:.02em;
  transition:transform 140ms var(--ease),background-color 160ms,border-color 160ms;
}
.btn:active{transform:scale(.965)}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 12px;font-size:12.5px;border-radius:11px}
.btn svg{width:16px;height:16px}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:11px;
  border:1px solid var(--line);font-size:12.5px;color:var(--muted);background:transparent;
  transition:transform 130ms var(--ease),background-color 160ms,color 160ms,border-color 160ms;
  white-space:nowrap;
}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -15px;padding-inline:15px}
.scroller::-webkit-scrollbar{display:none}

/* ============ التنقل السفلي ============ */
.nav{
  position:fixed;z-index:30;bottom:calc(10px + env(safe-area-inset-bottom));
  left:50%;transform:translateX(-50%);
  width:min(calc(100% - 24px),560px);
  height:62px;border-radius:20px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  border:1px solid var(--line);
  backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  box-shadow:0 10px 30px -18px rgba(0,0,0,.7);
}
.nav button{
  position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--dim);transition:color 200ms var(--ease);
}
.nav button .ni{transition:transform 260ms var(--ease);display:block}
.nav button.on{color:var(--ink)}
.nav button.on .ni{transform:translateY(-2px) scale(1.06)}
.nav button:active .ni{transform:scale(.88)}
.nav button .nl{font-size:9px;letter-spacing:.06em;opacity:.9}
.nav button .bar{
  position:absolute;top:6px;width:16px;height:2px;border-radius:2px;background:var(--ink);
  transform:scaleX(0);opacity:0;transition:transform 260ms var(--ease),opacity 200ms;
}
.nav button.on .bar{transform:scaleX(1);opacity:.9}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.nav button.animate .ni{animation:pop 320ms var(--ease)}

/* ============ الحلقات ============ */
.rings{display:grid;place-items:center;position:relative;padding:4px 0 2px}
.ringwrap{position:relative;width:186px;height:186px;display:grid;place-items:center}
.ringwrap svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap circle{fill:none;stroke-linecap:round;transition:stroke-dashoffset 700ms var(--ease)}
.ringwrap .tk{stroke:var(--line2)}
.ringcenter{text-align:center;line-height:1}
.ringcenter b{font-size:34px;font-weight:600;letter-spacing:-.03em}
.ringcenter b i{font-style:normal;font-size:15px;color:var(--muted);margin-inline-start:1px}
.ringcenter small{display:block;font-size:9.5px;letter-spacing:.16em;color:var(--muted);margin-top:8px}

/* ============ مشهد اليوم (SVG حي) ============ */
.scene{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.scene svg{display:block;width:100%;height:auto}
.scene .arc{fill:none;stroke-width:1.2}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:11px 14px 13px;border-top:1px solid var(--line2)}
.legend div{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.legend i{width:12px;height:2px;border-radius:2px;background:currentColor;display:block}

/* ============ الجدول / المهام ============ */
.item{
  display:flex;align-items:center;gap:11px;padding:11px 0;
  border-bottom:1px solid var(--line2);
  animation:enter 300ms var(--ease) both;
}
.item:last-child{border-bottom:0}
.item .t{font-size:13px;color:var(--muted);min-width:52px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.item .body{flex:1;min-width:0}
.item .body b{display:block;font-size:14px;font-weight:600;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .body small{display:block;font-size:11px;color:var(--dim);margin-top:3px;letter-spacing:.03em}
.item.done .body b{text-decoration:line-through;color:var(--dim);text-decoration-thickness:1px}
.item .dotmk{width:7px;height:7px;border-radius:50%;background:var(--ink);flex:0 0 7px;opacity:.9}
.check{
  width:26px;height:26px;flex:0 0 26px;border-radius:9px;border:1px solid var(--line);
  display:grid;place-items:center;transition:background-color 160ms,border-color 160ms,transform 140ms var(--ease);
}
.check svg{width:13px;height:13px;stroke-width:2.4;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset 240ms var(--ease)}
.check:active{transform:scale(.88)}
.check.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.check.on svg{stroke-dashoffset:0}
.mini{width:44px;height:44px;flex:0 0 44px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center}

/* ============ المقياس ============ */
.metric{display:flex;flex-direction:column;gap:6px;padding:10px 0}
.metric .lab{display:flex;align-items:baseline;gap:7px;font-size:12px}
.metric .lab b{font-size:15px;font-weight:600;letter-spacing:-.02em}
.track{height:5px;border-radius:5px;background:var(--surface3);overflow:hidden;position:relative}
.track i{display:block;height:100%;background:var(--ink);border-radius:5px;width:0;transition:width 800ms var(--ease)}
.track.low i{background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 10px)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:1px solid var(--line);border-radius:15px;padding:11px;background:var(--surface2)}
.stat .v{font-size:19px;font-weight:600;letter-spacing:-.03em;display:flex;align-items:baseline;gap:3px}
.stat .v i{font-style:normal;font-size:10.5px;color:var(--muted)}
.stat .k{font-size:10px;color:var(--muted);letter-spacing:.1em;margin-top:5px}

/* ============ الإدخال ============ */
label.f{display:block;margin-bottom:11px}
label.f > span{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;margin-bottom:6px}
.inp{
  width:100%;height:44px;border-radius:13px;border:1px solid var(--line);
  background:var(--surface2);padding:0 13px;font-size:14px;outline:none;
  transition:border-color 160ms,background-color 160ms;
}
.inp:focus{border-color:var(--ink)}
textarea.inp{height:auto;padding:11px 13px;resize:vertical;min-height:70px;line-height:1.5}
select.inp{appearance:none;background-image:none}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .inp{text-align:center;flex:1}
.stepper button{width:44px;height:44px;flex:0 0 44px;border-radius:13px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;font-size:20px;font-weight:500}
.stepper button:active{transform:scale(.94)}

/* ============ اللوحات (Sheet) ============ */
.mask{
  position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity 240ms var(--ease);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;z-index:61;inset-inline:0;bottom:0;
  background:var(--surface);border:1px solid var(--line);border-bottom:0;
  border-radius:26px 26px 0 0;
  max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateY(103%);visibility:hidden;
  transition:transform 340ms var(--ease),visibility 0s linear 340ms;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom));
  max-width:720px;margin:0 auto;
}
.sheet.on{transform:none;visibility:visible;transition:transform 340ms var(--ease),visibility 0s}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:6px auto 14px}
@media(min-width:760px){
  .sheet{bottom:auto;top:50%;border-radius:24px;border-bottom:1px solid var(--line);
    transform:translateY(-46%) scale(.96);opacity:0;pointer-events:none;visibility:hidden;
    transition:transform 300ms var(--ease),opacity 220ms;max-height:86vh;padding-inline:22px}
  .sheet.on{transform:translateY(-50%) scale(1);opacity:1;pointer-events:auto;visibility:visible}
}

/* ============ التنبيهات ============ */
.toasts{position:fixed;z-index:80;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
.toast{
  max-width:min(440px,100%);background:var(--ink);color:var(--bg);
  border-radius:14px;padding:11px 15px;display:flex;align-items:center;gap:9px;
  font-size:12.5px;font-weight:600;letter-spacing:.01em;
  transform:translateY(14px) scale(.97);opacity:0;transition:transform 280ms var(--ease),opacity 220ms;
  box-shadow:0 14px 34px -18px rgba(0,0,0,.8);pointer-events:auto;
}
.toast.on{transform:none;opacity:1}
.toast span{white-space:normal;line-height:1.45;text-align:start}
.toast svg{width:17px;height:17px;flex:0 0 17px}
.toast small{font-weight:400;opacity:.6;font-size:11px}

/* ============ إشعارات داخل التطبيق ============ */
.notif{
  display:flex;gap:11px;padding:12px;border:1px solid var(--line);border-radius:15px;
  background:var(--surface2);margin-bottom:9px;animation:enter 300ms var(--ease) both;
}
.notif.unread{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.notif .nb{flex:1;min-width:0}
.notif .nb b{font-size:13px;font-weight:600;display:block}
.notif .nb p{margin:4px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.notif .nb time{font-size:10px;color:var(--dim);letter-spacing:.06em;display:block;margin-top:6px}

/* ============ المشي / الجولة ============ */
.big-ring{display:grid;place-items:center;padding:6px 0 2px}
.pulse{animation:softpulse 3.4s ease-in-out infinite}
@keyframes softpulse{0%,100%{opacity:.5}50%{opacity:1}}
.gate{display:grid;place-items:center;text-align:center;gap:14px;padding:36px 18px}
.gate .mark2{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}

/* ============ مفاتيح / إعدادات ============ */
.set{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2)}
.set:last-child{border-bottom:0}
.set .sb{flex:1;min-width:0}
.set .sb b{font-size:13.5px;font-weight:600;display:block}
.set .sb small{font-size:11px;color:var(--muted);display:block;margin-top:3px;line-height:1.45}
.sw{width:46px;height:27px;border-radius:20px;border:1px solid var(--line);background:var(--surface3);position:relative;flex:0 0 46px;transition:background-color 200ms,border-color 200ms}
.sw i{position:absolute;top:2px;inset-inline-start:2px;width:21px;height:21px;border-radius:50%;background:var(--muted);transition:transform 240ms var(--ease),background-color 200ms}
.sw.on{background:var(--ink);border-color:var(--ink)}
.sw.on i{transform:translateX(-19px);background:var(--bg)}
[dir="ltr"] .sw.on i{transform:translateX(19px)}

.empty{text-align:center;color:var(--dim);font-size:12.5px;padding:26px 10px;line-height:1.7}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--surface3);border:1px solid var(--line2)}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--ink) 25%,var(--surface3))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--ink) 50%,var(--surface3))}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--ink) 75%,var(--surface3))}
.heat i[data-l="4"]{background:var(--ink)}
.hbars{display:flex;align-items:flex-end;gap:6px;height:96px;margin-top:6px;position:relative}
.hbars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.hbars i{width:100%;border-radius:4px 4px 2px 2px;background:var(--ink);min-height:3px;transition:height 700ms var(--ease)}
.hbars div.today i{opacity:1;background:var(--ink);position:relative}
.hbars div.today i::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 1px var(--ink)}
.hbars span{font-size:9px;color:var(--dim)}

@media (max-width:720px){
  .scroller{touch-action:pan-x;-webkit-overflow-scrolling:touch}
}
@media (min-width:721px){
  .ringwrap{width:210px;height:210px}
  .wrap{max-width:760px;padding-top:20px}
  .nav{max-width:600px}
  .grid2{gap:14px}
}
@media (hover:hover){
  .btn:hover,.chip:hover,.icon-btn:hover{border-color:var(--ink)}
  .btn.solid:hover{opacity:.9}
  .item:hover .body b{letter-spacing:.02em}
}
/* ====== حركة وحيوية ====== */
.splash{
  position:fixed;inset:0;z-index:200;background:var(--bg);
  display:grid;place-items:center;align-content:center;gap:16px;
  transition:opacity 520ms var(--ease),visibility 0s linear 520ms;
}
.splash.gone{opacity:0;visibility:hidden;pointer-events:none}
.splash-mark{
  width:66px;height:66px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink);
  animation:splashPop 760ms var(--ease) both;
}
.splash-mark svg{width:32px;height:32px}
.splash-name{
  font-family:"Iowan Old Style","Palatino Linotype",Georgia,"Amiri",serif;
  font-size:27px;letter-spacing:.22em;opacity:0;padding-inline-start:.22em;
  animation:splashName 820ms 240ms var(--ease) forwards;
}
.splash-line{width:0;height:1px;background:var(--line);animation:lineGrow 900ms 420ms var(--ease) forwards}
@keyframes splashPop{from{transform:scale(.72) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes splashName{to{opacity:1;letter-spacing:.06em}}
@keyframes lineGrow{to{width:132px}}

.screen > *{animation:riseIn 470ms var(--ease) both}
.screen > *:nth-child(2){animation-delay:60ms}
.screen > *:nth-child(3){animation-delay:110ms}
.screen > *:nth-child(4){animation-delay:155ms}
.screen > *:nth-child(5){animation-delay:195ms}
.screen > *:nth-child(6){animation-delay:230ms}
.screen > *:nth-child(n+7){animation-delay:260ms}
@keyframes riseIn{from{opacity:0;transform:translateY(15px) scale(.994);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}

.track i{position:relative;overflow:hidden}
.track i::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 25%,rgba(255,255,255,.42) 50%,transparent 75%);
  transform:translateX(-130%);animation:sheen 1150ms 420ms var(--ease) 1 both;
}
[data-theme="light"] .track i::after{background:linear-gradient(100deg,transparent 25%,rgba(0,0,0,.18) 50%,transparent 75%)}
@keyframes sheen{to{transform:translateX(130%)}}

.confetti{position:fixed;z-index:99;background:var(--ink);pointer-events:none;will-change:transform,opacity}

.challenge{
  border:1px solid var(--line);border-radius:var(--r);padding:15px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,var(--surface2),var(--surface));
}
.challenge .badge{
  display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.16em;
  border:1px solid var(--line);border-radius:20px;padding:4px 10px;color:var(--muted);
}
.challenge .bar{height:6px;border-radius:6px;background:var(--surface3);overflow:hidden;margin-top:12px}
.challenge .bar i{display:block;height:100%;background:var(--ink);border-radius:6px;width:0;transition:width 900ms var(--ease)}
.challenge .glow{
  position:absolute;width:150px;height:150px;border-radius:50%;inset-inline-start:-40px;top:-70px;
  background:radial-gradient(circle,color-mix(in srgb,var(--ink) 16%,transparent),transparent 70%);
  animation:breathe 6s ease-in-out infinite;pointer-events:none;
}
@keyframes breathe{0%,100%{opacity:.5;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}

.flame{display:inline-flex;align-items:center;gap:5px}
.flame svg{animation:flick 2.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:translateY(0) scale(1);opacity:.85}50%{transform:translateY(-1px) scale(1.06);opacity:1}}

.btn.pulseOnce{animation:btnPulse 600ms var(--ease)}
@keyframes btnPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ink) 40%,transparent)}100%{box-shadow:0 0 0 14px transparent}}

/* ====== إعدادات المظهر والخط (data-font / data-size) ====== */
[data-font="serif"]{--font-body:"Iowan Old Style","Palatino Linotype",Georgia,"Amiri","Times New Roman",serif;--font-title:var(--font-body)}
[data-font="mono"]{--font-body:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;--font-title:ui-monospace,"SF Mono",Menlo,monospace}
[data-size="sm"]{--fsm:.93}
[data-size="md"]{--fsm:1}
[data-size="lg"]{--fsm:1.08}
[data-size="xl"]{--fsm:1.16}
.inp,.btn,.chip{font-size:calc(14px * var(--fsm))}
.item .body b{font-size:calc(14px * var(--fsm))}
.item .body small,.tiny,.set .sb small,.notif .nb p,.notif .nb time{font-size:calc(11px * var(--fsm))}
.h,.legend div{font-size:calc(10.5px * var(--fsm))}
.stat .v{font-size:calc(19px * var(--fsm))}
.ringcenter b{font-size:calc(34px * var(--fsm))}
.nav button .nl{font-size:calc(9px * var(--fsm))}

/* ====== رِبل اللمس (إحساس مادي) ====== */
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);pointer-events:none;animation:rip 520ms cubic-bezier(.22,.61,.36,1) forwards}
@keyframes rip{to{transform:scale(2.6);opacity:0}}

/* ====== تحكم مقسّم / شرائح ====== */
.seg{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:15px;background:var(--surface2)}
.seg button{flex:1;height:38px;border-radius:11px;font-size:calc(12.5px * var(--fsm));color:var(--muted);font-weight:500;
  transition:background-color 220ms var(--ease),color 220ms var(--ease),transform 120ms var(--ease);position:relative;overflow:hidden}
.seg button:active{transform:scale(.96)}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:700}
.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daysel{height:42px;border-radius:13px;border:1px solid var(--line);background:var(--surface2);
  font-size:calc(11px * var(--fsm));color:var(--muted);display:grid;place-items:center;
  transition:background-color 180ms var(--ease),color 180ms,border-color 180ms,transform 110ms var(--ease)}
.daysel:active{transform:scale(.93)}
.daysel.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}

/* ====== لوحة الأرقام ====== */
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}
.kp button{height:58px;border:1px solid var(--line);border-radius:17px;background:var(--surface2);
  font-size:21px;font-weight:600;position:relative;overflow:hidden;
  transition:transform 90ms var(--ease),background-color 140ms}
.kp button:active{transform:scale(.94);background:var(--surface3)}
.kp button.fn{font-size:13px;font-weight:600;color:var(--muted)}
.kp-disp{text-align:center;padding:16px 0 8px;line-height:1}
.kp-disp b{font-size:calc(40px * var(--fsm));font-weight:600;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.kp-disp span{display:block;font-size:calc(11px * var(--fsm));color:var(--muted);letter-spacing:.14em;margin-top:8px}
.kp-quick{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.kp-quick button{height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--line);font-size:calc(11.5px * var(--fsm));color:var(--muted)}
.kp-quick button:active{background:var(--surface3)}

/* ====== منزلق ====== */
.slider{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:2px 0}
.slider::-webkit-slider-runnable-track{height:7px;border-radius:7px;background:var(--surface3)}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--ink);
  margin-top:-11.5px;box-shadow:0 3px 10px -2px rgba(0,0,0,.55);border:3px solid var(--bg)}
.slider::-moz-range-track{height:7px;border-radius:7px;background:var(--surface3)}
.slider::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--ink);border:3px solid var(--bg)}

/* ====== نظام الأثر ====== */
.trace{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);
  background:linear-gradient(155deg,var(--surface2),var(--surface));padding:16px}
.trace .rings{position:relative;display:grid;place-items:center;flex:0 0 auto}
.trace .rings svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.trace .rings circle{fill:none;stroke-linecap:round;transition:stroke-dashoffset 900ms var(--ease)}
.trace .core{text-align:center;line-height:1}
.trace .core b{font-size:calc(30px * var(--fsm));font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.trace .core em{display:block;font-style:normal;font-size:calc(9px * var(--fsm));letter-spacing:.1em;color:var(--muted);margin-top:7px}
.trace-row{display:flex;align-items:center;gap:16px;margin-top:12px}
.trace-info{flex:1;min-width:0}
.trace .lvl{display:flex;align-items:baseline;gap:8px;justify-content:center;margin-top:2px}
.trace .lvl b{font-size:calc(15px * var(--fsm));font-weight:600}
.trace .lvl span{font-size:calc(10.5px * var(--fsm));color:var(--muted);letter-spacing:.06em}
.ladder{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.ladder div{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:calc(12px * var(--fsm))}
.ladder div:last-child{border-bottom:0}
.ladder .node{width:18px;height:18px;flex:0 0 18px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:9px;color:var(--muted)}
.ladder div.done .node{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ladder div.now .node{box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 18%,transparent);border-color:var(--ink)}
.ladder div.done span.n,.ladder div.now span.n{color:var(--ink);font-weight:600}
.ladder .pts{margin-inline-start:auto;font-size:calc(10.5px * var(--fsm));color:var(--dim);font-variant-numeric:tabular-nums}

.xpchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:9px;
  border:1px solid var(--line);font-size:calc(10.5px * var(--fsm));letter-spacing:.03em;color:var(--muted)}
.xpchip b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}

.next{display:flex;align-items:center;gap:12px;padding:13px;border-radius:15px;border:1px solid var(--ink);
  background:color-mix(in srgb,var(--ink) 6%,var(--surface));position:relative;overflow:hidden}
.next .mini .ic{color:var(--ink)}
.next .btn.solid .ic{color:var(--bg)}
.next .txt{flex:1;min-width:0}
.next .txt b{display:block;font-size:calc(13.5px * var(--fsm));font-weight:600}
.next .txt small{display:block;font-size:calc(11px * var(--fsm));color:var(--muted);margin-top:3px;line-height:1.4}

/* ====== محاذاة الشاشات: آيفون/أندرويد ====== */
@supports (height: 100dvh){
  body{min-height:100dvh}
  .sheet{max-height:min(92dvh,860px)}
  .splash{height:100dvh}
}
.sheet{display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:contain}
.sheet-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0;
  margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.sheet-scroll::-webkit-scrollbar{display:none}
.sheet .grab{flex:0 0 auto;position:sticky;top:0;z-index:3;background:var(--surface)}
.sheet-foot{flex:0 0 auto;padding-top:10px;background:var(--surface);border-top:1px solid var(--line2);margin-top:8px}
.sheet-handle{display:none}

@media (pointer:coarse){
  .inp,.btn,.chip,select.inp{font-size:max(16px, calc(14px * var(--fsm)))}
  .btn{height:46px}
  .nav button{min-height:48px}
}
@media (max-width:400px){
  .wrap{padding-inline:12px}
  .card{padding:13px}
  .ringwrap{width:170px;height:170px}
  .trace .rings{width:158px;height:158px}
  .stat .v{font-size:calc(17px * var(--fsm))}
}
@media (max-height:720px){
  .top{padding-top:calc(8px + env(safe-area-inset-top))}
  .ringwrap{width:164px;height:164px}
  .scene svg{max-height:150px}
}
@media (min-width:721px){
  .sheet{max-width:600px}
  .kp button{height:54px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<script>
/* =====================================================================
   أَثَر — تطبيق محلي بالكامل. كل البيانات تُحفظ على الجهاز (localStorage
   + نسخة احتياطية يومية داخل نفس الجهاز). لا يوجد أي اتصال بالشبكة.
   ===================================================================== */
'use strict';

/* ---------------- التخزين ----------------
   نستخدم localStorage مع بادئة واضحة + كتابة مؤجلة (debounce) لتقليل
   عمليات الكتابة = بطارية أطول. النسخ الاحتياطي داخل مفتاح منفصل. */
const KEY='athar.v1';
const BAK='athar.v1.bak';
/* هل التخزين الدائم متاح؟ (قد يكون محجوبًا داخل بعض إطارات المعاينة) */
let STORAGE_OK=true;
try{ localStorage.setItem('athar.probe','1'); localStorage.removeItem('athar.probe'); }
catch(e){ STORAGE_OK=false; }

const store={
  read(){
    try{
      const raw=localStorage.getItem(KEY) || localStorage.getItem(BAK);
      return raw? JSON.parse(raw) : null;
    }catch(e){ try{return JSON.parse(localStorage.getItem(BAK))}catch(_){return null} }
  },
  timer:null,
  save(d){
    if(!STORAGE_OK) return;
    clearTimeout(this.timer);
    this.timer=setTimeout(()=>{
      try{
        const raw=JSON.stringify(d);
        const prev=localStorage.getItem(KEY);
        if(prev && prev!==raw) localStorage.setItem(BAK,prev); // نسخة أمان
        localStorage.setItem(KEY,raw);
      }catch(e){ if(STORAGE_OK) toast('تعذّر الحفظ — مساحة الجهاز ممتلئة'); }
    },280);
  },
  flush(d){ if(!STORAGE_OK) return; clearTimeout(this.timer); try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){} }
};
window.addEventListener('pagehide',()=>store.flush(DB));
document.addEventListener('visibilitychange',()=>{ if(document.hidden) store.flush(DB); });

/* ---------------- أدوات ---------------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dayKey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dayKey();
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const AR_DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const AR_SHORT=['أحد','إثن','ثلا','أرب','خمي','جمع','سبت'];
const AR_MON=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const esc=s=>String(s??'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
const isoWeek=d=>{const t=new Date(d);t.setHours(0,0,0,0);t.setDate(t.getDate()+3-((t.getDay()+6)%7));const w1=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-w1)/864e5-3+((w1.getDay()+6)%7))/7)};
const daysAgoKey=n=>{const d=new Date();d.setDate(d.getDate()-n);return dayKey(d)};
const last7=()=>Array.from({length:7},(_,i)=>daysAgoKey(6-i));

/* ---------------- الأيقونات (مونوكروم، أحادية اللون) ---------------- */
const ICONS={
  sun:'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/>',
  pulse:'<path d="M2.5 12.5h3.2l2-5 3.2 10 2.6-7 1.8 2h6.2"/>',
  calendar:'<rect x="3.2" y="5" width="17.6" height="16" rx="4"/><path d="M8 3v4M16 3v4M3.2 10.2h17.6"/><circle cx="8.4" cy="14.6" r=".9" fill="currentColor" stroke="none"/><circle cx="12" cy="14.6" r=".9" fill="currentColor" stroke="none"/><circle cx="15.6" cy="14.6" r=".9" fill="currentColor" stroke="none"/>',
  chart:'<path d="M3.5 20.2h17"/><rect x="4.6" y="12" width="3.6" height="6" rx="1.4"/><rect x="10.2" y="7.6" width="3.6" height="10.4" rx="1.4"/><rect x="15.8" y="4" width="3.6" height="14" rx="1.4"/>',
  gear:'<path d="M4 7.5h5.5M15.5 7.5H20M4 16.5h9M18.5 16.5H20"/><circle cx="12.6" cy="7.5" r="2.3"/><circle cx="15.6" cy="16.5" r="2.3"/>',
  check:'<path d="M4 12.6l4.6 4.6L20 5.6"/>',
  plus:'<path d="M12 5.2v13.6M5.2 12h13.6"/>',

function bmr(){
  const p=DB.profile, w=+p.weight||70, h=+p.height||170, a=+p.age||28;
  // Mifflin-St Jeor
  return p.sex==='m' ? 10*w+6.25*h-5*a+5 : 10*w+6.25*h-5*a-161;
}
function tdee(){
  const f={sed:1.2,light:1.375,mod:1.55,high:1.725}[DB.profile.activity]||1.375;
  return bmr()*f;
}

  const t=tdee(); const g=DB.profile.goalType;
  if(g==='lose') return Math.round(t-450);
  if(g==='gain') return Math.round(t+350);
  return Math.round(t);
}

  const p=DB.profile, h=(+p.height||170)/100, w=+p.weight||70;

}

/* =====================================================================
   نظام الأثر — تقدّم يُرى ويتقدّم
   • كل فعل صحي يمنح نقاطًا (XP) مرة واحدة في اليوم لكل مصدر.
   • المستويات عتبات متزايدة: كل مستوى يحتاج أكثر من سابقه.
   • خوارزمية الإرشاد (coach) تقرأ آخر ٧ أيام واقتراحك القادم يتبع أضعف
     مؤشر عندك — فالتطبيق يقودك خطوة واحدة، لا يغرقك بعشرة أوامر.
   ===================================================================== */
const LEVELS=[
  {t:'بداية الأثر',    xp:0,    d:'الخطوة الأولى'},
  {t:'خطوة ثانية',     xp:120,  d:'انتظام ثلاثة أيام'},
  {t:'إيقاع',          xp:320,  d:'أسبوع واحد منتظم'},
  {t:'ثبات',           xp:700,  d:'عشرون يومًا'},
  {t:'أُلفة',          xp:1300, d:'شهر من الأثر'},
  {t:'تجدّد',          xp:2100, d:'جسد يطلب الحركة'},
  {t:'تمكين',          xp:3200, d:'أنت من يقود الآن'},
  {t:'أثر راسخ',       xp:4700, d:'نمط حياة'},
  {t:'صعود',           xp:6700, d:'قدرة تتشكّل'},
  {t:'أُفق',           xp:9200, d:'تطوّر مستمر'}
];
function levelOf(xp){
  let i=0; for(let k=0;k<LEVELS.length;k++) if(xp>=LEVELS[k].xp) i=k;
  return i;
}
function levelInfo(){
  const xp=DB.trace.xp||0, i=levelOf(xp);
  const cur=LEVELS[i], nxt=LEVELS[i+1];
  const span=nxt? nxt.xp-cur.xp : 1;
  const into=xp-cur.xp;
  return {i, cur, nxt, xp, into, span, pct: nxt? clamp(Math.round(into/span*100),0,100) : 100,
          toNext: nxt? Math.max(0,nxt.xp-xp) : 0};
}
function addXP(n, key){
  if(!n) return 0;
  const dk=today();
  if(key){
    DB.trace.log[dk]=DB.trace.log[dk]||{};
    if(DB.trace.log[dk][key]) return 0;      // مكافأة مرة واحدة يوميًا
    DB.trace.log[dk][key]=n;
  }
  const before=levelOf(DB.trace.xp||0);
  const n2=Math.max(1,Math.round(n*xpMult()));
  n=n2;
  DB.trace.xp=Math.max(0,(DB.trace.xp||0)+n);
  DB.trace.level=levelOf(DB.trace.xp);
  const after=DB.trace.level;
  save();
  if(after>before) setTimeout(()=>levelUp(after),420);
  return n;
}
function levelUp(i){
  const L=LEVELS[i];
  pushNotif('مستوى جديد: '+L.t, L.d+' — '+DB.trace.xp+' نقطة أثر');
  celebrate(30);
  toast('تطوّر: '+L.t, 'أنت الآن في مستوى '+i+' من '+LEVELS.length);
}

/* ===== خوارزمية الإرشاد: تقرأ ٧ أيام وتقترح خطوة واحدة ===== */
function coach(){
  const t=day(), G_=G();
  const keys=last7().filter(k=>k!==today());
  const avg=fn=>{ const v=keys.map(fn); return v.reduce((a,b)=>a+b,0)/(v.length||1); };
  const wRate=avg(k=>(DB.days[k]?.water||0))/G_.water;
  const sRate=avg(k=>(DB.days[k]?.steps||0))/G_.steps;
  const slRate=avg(k=>(DB.days[k]?.sleep||0))/G_.sleep;
  const doneRate=avg(k=>Object.values(DB.days[k]?.tasks||{}).filter(Boolean).length)/Math.max(1,tasksFor(today()).length);
  const moodAvg=avg(k=>{const m=DB.days[k]?.mood; return m==null?2:m})/3;

  const todayGaps=[
    {k:'water', gap:1-(t.water||0)/G_.water, act:'water', label:'كوب ماء الآن', icon:'drop', xp:10,
     why:'ماؤك اليوم '+(t.water||0)+' من '+G_.water},
    {k:'steps', gap:1-(t.steps||0)/G_.steps, act:'addsteps', label:'1000 خطوة (٨ دقائق مشي)', icon:'walk', xp:14,
     why:'باقٍ '+Math.max(0,G_.steps-(t.steps||0)).toLocaleString('en')+' خطوة لهدفك'},
    {k:'sleep', gap:1-(t.sleep||0)/G_.sleep, act:'newsleep', label:'سجّل نومك', icon:'moon', xp:12,
     why:(t.sleep||0)?'نمت '+(t.sleep||0)+' ساعة — الهدف '+G_.sleep:'لم تُسجّل نوم الليلة'},
    {k:'cal', gap:(t.cal||0)>targetCal()*1.15?1:0, act:'newcal', label:'اضبط سعراتك', icon:'food', xp:8,
     why:'سعراتك '+(t.cal||0)+' مقابل هدف '+targetCal()},
    {k:'tasks', gap:1-Object.values(t.tasks||{}).filter(Boolean).length/Math.max(1,todayAgenda().length), act:'newtask', label:'أضف مهمة واحدة صغيرة', icon:'target', xp:10,
     why:'جدولك اليوم فيه '+todayAgenda().length+' عناصر'}
  ];
  // الوزن: أضعف مؤشر إذا لم نسجّل منذ ٤ أيام
  const lastW=DB.weights[DB.weights.length-1];
  const wStale=!lastW || (new Date(today())-new Date(lastW.d))/864e5 >= 3;

  // الأولوية: أضعف مؤشر تاريخيًا × حجم الفجوة اليوم
  const hist={water:wRate, steps:sRate, sleep:slRate, tasks:doneRate};
  const scored=todayGaps.map(g=>({...g, score:(1-hist[g.k]??.5)*0.6 + g.gap*0.4}));
  if(wStale && (moodAvg>.4)) scored.push({k:'weight', gap:.8, act:'weight', label:'سجّل وزنك (قياس واحد)', icon:'scale', xp:16, why:'لم تُسجل وزنك منذ '+(lastW?Math.round((new Date(today())-new Date(lastW.d))/864e5)+' أيام':'البداية'), score:.72});
  scored.sort((a,b)=>b.score-a.score);

  const weakest=['water','steps','sleep','tasks'].sort((a,b)=>(hist[a]??0)-(hist[b]??0))[0];
  const weakName={water:'الماء',steps:'الحركة',sleep:'النوم',tasks:'الالتزام بالمهام'}[weakest];
  return {next:scored[0], all:scored, hist, weakest, weakName};
}

/* =====================================================================
   مشهد اليوم — SVG حي: قوس زمني من 6 صباحًا إلى 23، وأربعة أقواس
   ===================================================================== */
function polar(cx,cy,r,ang){ const a=(ang-180)*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
function arcPath(cx,cy,r,a1,a2){
  const [x1,y1]=polar(cx,cy,r,a1), [x2,y2]=polar(cx,cy,r,a2);
  const large=(a2-a1)<=180?0:1;
  return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
}
function sceneSVG(){
  const W=340,H=176,cx=W/2,cy=150;
  const t=day();
  const items=[
    {k:'حركة', v:t.steps, g:G().steps, r:118, o:.95},
    {k:'ماء',  v:t.water, g:G().water, r:100, o:.72},
    {k:'نوم',  v:t.sleep, g:G().sleep, r:82,  o:.5},
    {k:'سعرات',v:t.cal,   g:targetCal(), r:64, o:.3}
  ];
  const now=new Date();
  const hh=now.getHours()+now.getMinutes()/60;
  const ang=clamp((hh-6)/17,0,1)*180;
  const [mx,my]=polar(cx,cy,138,ang);
  let s=`<svg viewBox="0 0 ${W} ${H}" aria-label="مشهد اليوم">
    <defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="currentColor" stop-opacity=".10"/>
      <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
    </linearGradient></defs>
    <g style="color:var(--line)">`;
  // خط الأساس + أرضية
  s+=`<line x1="14" y1="${cy}" x2="${W-14}" y2="${cy}" stroke="currentColor" stroke-width="1"/>`;
  for(let i=0;i<=17;i+=1){
    const a=i*180/17, [x1,y1]=polar(cx,cy,132,a), [x2,y2]=polar(cx,cy,i%3===0?126:129,a);
    s+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="currentColor" stroke-width="1" opacity="${i%3===0?.9:.45}"/>`;
  }
  s+=`</g>`;
  // المنطقة تحت قوس الحركة (شعاع خفيف)
  const p=clamp(t.steps/(G().steps*1.15),0.01,1);
  const [ax,ay]=polar(cx,cy,118,p*180);
  s+=`<path d="M${cx-118} ${cy} A118 118 0 0 1 ${ax.toFixed(1)} ${ay.toFixed(1)} L${ax.toFixed(1)} ${cy} Z" fill="url(#fg)" style="color:var(--ink)"/>`;

  items.forEach((it,i)=>{
    const q=clamp(it.v/(it.g||1),0,1);
    s+=`<path d="${arcPath(cx,cy,it.r,0,180)}" fill="none" stroke="var(--line)" stroke-width="${i===0?2.4:1.6}" opacity=".65"/>`;
    if(q>0.004){
      s+=`<path d="${arcPath(cx,cy,it.r,0,q*180)}" fill="none" stroke="var(--ink)" stroke-width="${i===0?2.6:1.8}"
           stroke-linecap="round" opacity="${it.o}" style="stroke-dasharray:600;stroke-dashoffset:600;animation:sweep 900ms ${i*120}ms cubic-bezier(.22,.61,.36,1) forwards"/>`;
    }
    // علامة بداية/نهاية القوس
    [[0,it.o*.5],[180,it.o]].forEach(([a,op])=>{
      const [ex,ey]=polar(cx,cy,it.r,a);
      s+=`<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="1.4" fill="var(--ink)" opacity="${op.toFixed(2)}"/>`;
    });
  });
  // مؤشر الوقت الآن
  s+=`<g><line x1="${cx}" y1="${cy}" x2="${mx.toFixed(1)}" y2="${my.toFixed(1)}" stroke="var(--ink)" stroke-width="1" opacity=".55"/>
      <circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="3.4" fill="var(--ink)"/>
      <circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="7" fill="none" stroke="var(--ink)" stroke-width="1" opacity=".3" class="pulse"/></g>`;
  // نص
  s+=`<text x="${cx}" y="${cy-118-12}" text-anchor="middle" fill="var(--muted)" font-size="10" letter-spacing="2">${pad(now.getHours())}:${pad(now.getMinutes())}</text>`;
  s+=`<text x="18" y="${cy+16}" fill="var(--dim)" font-size="9" letter-spacing="1">06</text>
      <text x="${W-24}" y="${cy+16}" fill="var(--dim)" font-size="9" letter-spacing="1">23</text>`;
  s+=`</svg>`;
  return s;
}

function tasksFor(dk){
  const wd=new Date(dk+'T12:00:00').getDay();
  return DB.tasks.filter(t=>{
    if(t.date) return t.date===dk;
    if(t.days && t.days.length) return t.days.includes(wd);
    return true;
  });
}
function todayAgenda(){
  const dk=today(), t=day(dk), list=tasksFor(dk).map(x=>({
    ...x, done: !!t.tasks[x.id], kind:'task'
  }));
  // إضافة المواعيد كعناصر
  DB.appts.filter(a=>a.d===dk).forEach(a=>list.push({id:'appt:'+a.id,title:a.title,time:a.time,done:!!t.tasks['appt:'+a.id],kind:'appt'}));
  return list.sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
}

/* =====================================================================
   إحساس لمسي: موجة من نقطة الضغط على أي زر/شريحة
   ===================================================================== */
(function rippleTouch(){
  addEventListener('pointerdown',e=>{
    const el=e.target.closest('.btn,.chip,.seg button,.kp button,.nav button,.icon-btn,.sw,.card button');
    if(!el || DB.prefs.calm) return;
    const cs=getComputedStyle(el);
    if(cs.position==='static') el.style.position='relative';
    el.style.overflow='hidden';
    const r=el.getBoundingClientRect();
    const d=Math.max(r.width,r.height);
    const sp=document.createElement('span');
    sp.className='ripple';
    sp.style.width=sp.style.height=d+'px';
    sp.style.left=(e.clientX-r.left-d/2)+'px';
    sp.style.top=(e.clientY-r.top-d/2)+'px';
    el.appendChild(sp);
    setTimeout(()=>sp.remove(),540);
  },{passive:true});
})();

/* =====================================================================
   احتفال خفيف + تحدّي اليوم
   ===================================================================== */
function celebrate(n=16){
  if(DB.prefs.calm || document.documentElement.dataset.calm==='1') return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const host=document.createElement('div');
  host.style.cssText='position:fixed;inset:0;z-index:99;pointer-events:none';
  document.body.appendChild(host);
  for(let i=0;i<n;i++){
    const p=document.createElement('i');
    p.className='confetti';
    const size=4+Math.random()*5;
    p.style.cssText=`left:${50+(Math.random()*60-30)}%;top:${58+Math.random()*12}%;width:${size}px;height:${size*1.6}px;border-radius:${Math.random()>.5?'50%':'2px'};opacity:${.5+Math.random()*.5}`;
    host.appendChild(p);
    const dx=(Math.random()*240-120), dy=-(90+Math.random()*150), rot=Math.random()*720-360;
    p.animate([
      {transform:'translate(0,0) rotate(0deg)',opacity:1},
      {transform:`translate(${dx}px, ${dy}px) rotate(${rot*.55}deg)`,opacity:1,offset:.45},
      {transform:`translate(${dx*1.5}px, ${dy+230+Math.random()*90}px) rotate(${rot}deg)`,opacity:0}
    ],{duration:1100+Math.random()*520,easing:'cubic-bezier(.22,.61,.36,1)'}).onfinish=()=>p.remove();
  }
  setTimeout(()=>host.remove(),1900);
}

/* شرارة موضعية عند الضغط على عنصر */
function sparkAt(node){
  if(DB.prefs.calm || !node) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r=node.getBoundingClientRect();
  const host=document.createElement('div');
  host.style.cssText='position:fixed;inset:0;z-index:98;pointer-events:none';
  document.body.appendChild(host);
  for(let i=0;i<7;i++){
    const p=document.createElement('i'); p.className='confetti';
    p.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;width:3px;height:3px;border-radius:50%`;
    host.appendChild(p);
    const a=(Math.PI*2*i)/7 + Math.random();
    const d=16+Math.random()*16;
    p.animate([
      {transform:'translate(-50%,-50%) scale(1.1)',opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d}px)) scale(.2)`,opacity:0}
    ],{duration:460,easing:'cubic-bezier(.22,.61,.36,1)'}).onfinish=()=>p.remove();
  }
  setTimeout(()=>host.remove(),700);
}

/* تحدّي اليوم — عنصر متغيّر يوميًا يعطي سببًا للعودة */
const CHALLENGES=[
  {t:'500 خطوة إضافية — 5 دقائق فقط', k:'steps', goal:500},
  {t:'كوبان من الماء قبل الوجبات', k:'water', goal:2},
  {t:'15 دقيقة مشي بعد الغداء', k:'steps', goal:2000},
  {t:'10 دقائق تمدّد قبل النوم', k:'sleep', goal:.5},
  {t:'قفزة صغيرة: 300 خطوة الآن', k:'steps', goal:300},
  {t:'تمرين تنفّس 4-7-8 (جولتان)', k:'sleep', goal:.5},
  {t:'بلا سكر مضاف اليوم', k:'cal', goal:250}
];
function challengeToday(){
  const k=today().slice(0,10).replace(/-/g,'');
  const idx=Math.abs(parseInt(k,10))%CHALLENGES.length;
  return CHALLENGES[idx];
}
function challengeProgress(){
  const dk=today(), t=day(dk), c=challengeToday();
  const base=(DB.flags['chbase.'+dk]!==undefined)?DB.flags['chbase.'+dk]:null;
  return {c, cur:base===null?0:Math.max(0,(t[c.k]||0)-base), base};
}
function fmtGoal(n,k){
  if(k==='steps') return n.toLocaleString('en')+' خطوة';
  if(k==='water') return n+' أكواب';
  if(k==='sleep') return n+' ساعة';
  return n+' سعرة';
}
function challengeStart(){
  const dk=today(), t=day(dk), c=challengeToday();
  DB.flags['chbase.'+dk]=t[c.k]||0; save(); render();
  toast('بدأ التحدّي', 'الهدف: '+fmtGoal(c.goal,c.k));
}

/* فحص دوري خفيف: مرة كل دقيقة فقط، ويتوقف عند إخفاء الصفحة */
function selfCheck(){
  const dk=today(), t=day(dk), h=new Date().getHours(), now=pad(h)+':'+pad(new Date().getMinutes());
  // 1) مهمة/موعد حان وقته
  const mins=h*60+new Date().getMinutes();
  const toMin=hhmm=>{const [a,b]=hhmm.split(':').map(Number);return a*60+b};
  const inWindow=hhmm=>{ const d=mins-toMin(hhmm); return d>=0 && d<=120; };
  tasksFor(dk).forEach(x=>{
    if(!x.time || t.tasks[x.id] || !inWindow(x.time)) return;
    if(markFlag('due.'+x.id+'.'+dk)) pushNotif('حان وقت: '+x.title, 'مهمة اليوم بانتظارك · '+x.time);
  });
  DB.appts.filter(a=>a.d===dk && a.time && inWindow(a.time)).forEach(a=>{
    if(markFlag('appt.'+a.id+'.'+dk)) pushNotif('موعدك: '+a.title,'اليوم · '+a.time);
  });
  // 2) الماء
  if(h>=14 && t.water<Math.ceil(G().water/2) && markFlag('water.'+dk)) pushNotif('قليل من الماء حتى الآن','شربت '+t.water+' من '+G().water+' أكواب');
  // 3) الحركة
  if(h>=17 && t.steps<Math.round(G().steps*0.4) && markFlag('steps.'+dk)) pushNotif('تحرّك قليلًا','باقٍ '+(G().steps-t.steps).toLocaleString('en')+' خطوة لهدفك');
  // 4) النوم
  if(h>=22 && !t.sleep && markFlag('sleep.'+dk)) pushNotif('وقت الاستشفاء','سجّل نومك الليلة ليكتمل أثر اليوم');
}

let walkTimer=null, walkStart=null, walkSteps=0;
function sheetWalk(){
  walkSteps=0; walkStart=Date.now();
  openSheet(`
    <div class="rowline" style="margin-bottom:6px"><h2 class="h" style="margin:0">جلسة مشي</h2>
      <span class="spacer"></span><button class="btn sm ghost" data-close>${ic('x','sm')}</button></div>

    <div class="big-ring" style="margin-top:10px">
      <button id="tapPad" style="width:196px;height:196px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;position:relative;background:var(--surface2);transition:transform 120ms var(--ease)">
        <div style="text-align:center">
          <div class="num" id="wCount" style="font-size:36px;font-weight:600;letter-spacing:-.03em">0</div>
          <div class="tiny dim" style="letter-spacing:.14em;margin-top:4px">خطوة</div>
        </div>
      </button>
    </div>
    <div class="rowline" style="justify-content:center;margin-top:12px">
      <span class="tiny num" id="wTime" style="letter-spacing:.1em">00:00</span>
      <span class="tiny dim">·</span>
      <span class="tiny dim">الهدف ${G().steps.toLocaleString('en')}</span>
    </div>
    <div class="grid2" style="margin-top:14px">
      <button class="btn ghost" data-act="wadd100">+100</button>
      <button class="btn solid" data-act="wsave">${ic('check','sm')} إنهاء وحفظ</button>
    </div>
  `);
  clearInterval(walkTimer);
  walkTimer=setInterval(()=>{
    const s=Math.floor((Date.now()-walkStart)/1000);
    const el=$('#wTime'); if(!el){ clearInterval(walkTimer); return; }
    el.textContent=pad(Math.floor(s/60))+':'+pad(s%60);
  },1000);
  $('#tapPad').addEventListener('click',e=>{
    walkSteps+=10; const c=$('#wCount'); if(c) c.textContent=walkSteps;
    if(DB.prefs.haptics&&navigator.vibrate) try{navigator.vibrate(6)}catch(_){}
    e.currentTarget.style.transform='scale(.96)';
    setTimeout(()=>{ const p=$('#tapPad'); if(p) p.style.transform=''; },120);
  });
}
function saveWalk(){
  if(!walkSteps){ toast('لا خطوات لتُحفظ'); closeSheet(); return; }
  const t=day(); t.steps=(t.steps||0)+walkSteps;
  const secs=Math.round((Date.now()-walkStart)/1000);
  const g=addXP(Math.min(25,Math.round(walkSteps/200)+3),'walk'+today());
  save(); closeSheet(); clearInterval(walkTimer); render();
  toast('تم حفظ الجلسة'+(g?' · +'+g+' نقطة':''),walkSteps.toLocaleString('en')+' خطوة · '+Math.round(secs/60)+' د');
}

function doExport(){

  a.href=URL.createObjectURL(blob);
  a.download='athar-backup-'+today()+'.json';

  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  DB.lastExport=new Date().toLocaleString('ar-EG',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  save(); render(); toast('صُدّرت نسخة احتياطية','احفظها في ملفاتك');
}
function doImport(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=()=>{
    const f=inp.files?.[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d || typeof d!=='object' || !d.profile) throw 0;
        DB=Object.assign(DEF(),d); store.flush(DB); applyTheme(); render(); closeSheet(); updateBell();
        toast('استُعيدت بياناتك','كل شيء في مكانه');
      }catch(e){ toast('ملف غير صالح'); }
    };
    r.readAsText(f);
  };
  inp.click();
}

/* =====================================================================
   موزّع الأحداث
   ===================================================================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v, id=el.dataset.id;
  const t=day();
  switch(a){
    case 'water': {
      t.water=(t.water||0)+1;
      if(DB.flags['chbase.'+today()]===undefined && challengeToday().k==='water') DB.flags['chbase.'+today()]=(t.water-1);
      let gained=t.water<=G().water? addXP(6,'water') : 0;
      save(); render();
      if(t.water===G().water){ if(markFlag('wgoal.'+today())){ addXP(25,'wgoal'); pushNotif('أكملت الماء','هدف اليوم تحقق'); celebrate(18); } }
      else toast(gained? 'كوب ماء مسجّل · +'+gained : 'كوب ماء مسجّل', t.water+' من '+G().water+' أكواب');
      break;
    }
    case 'addsteps': {
      const before=(t.steps||0)>=G().steps;
      t.steps=(t.steps||0)+1000;
      const gained=Math.floor(t.steps/1000)<=Math.ceil(G().steps/1000)+4 ? addXP(8,'steps') : 0;
      if(!before && t.steps>=G().steps){ addXP(20,'stepsgoal'); celebrate(16); pushNotif('هدف الحركة تحقق', t.steps.toLocaleString('en')+' خطوة'); }
      save(); render(); toast('+1000 خطوة'+(gained?' · +'+gained:''), t.steps.toLocaleString('en')+' من '+G().steps.toLocaleString('en'));
      break;
    }
    case 'newsleep':
      openKeypad({title:'ساعات النوم', unit:'الهدف '+G().sleep+' ساعة', act:'sleep', key:'sleep',
        quick:[{l:'6',v:'6'},{l:'7',v:'7'},{l:'7.5',v:'7.5'},{l:'8',v:'8'}], saveLabel:'حفظ النوم'});
      kpState.value=String(t.sleep||'7'); kpRender(); break;
    case 'addsleep': t.sleep=+((+(t.sleep||0)+.5).toFixed(1)); {const g=(t.sleep||0)<=G().sleep+.5? addXP(7,'sleep') : 0; save(); render(); toast('+ نصف ساعة نوم'+(g?' · +'+g:''), t.sleep+' ساعة');} break;
    case 'addcal': t.cal=(t.cal||0)+300; {const g=(t.cal||0)<=targetCal()*1.1? addXP(3,'cal') : 0; save(); render(); toast('+300 سعرة'+(g?' · +'+g:''), t.cal+' من '+targetCal());} break;
    case 'newcal':
      openKeypad({title:'سعرات اليوم', unit:'الهدف '+targetCal()+' سعرة', act:'cal', key:'cal',
        quick:[{l:'+100',v:String((t.cal||0)+100)},{l:'+300',v:String((t.cal||0)+300)},{l:'+500',v:String((t.cal||0)+500)}],
        saveLabel:'حفظ السعرات'});
      kpState.value=String(t.cal||0); kpRender(); break;
    case 'mood': t.mood=+v; {const g=addXP(9,'mood'); save(); render(); toast('سُجّل المزاج'+(g?' · +'+g:''),MOODS[+v]);} break;
    case 'weight': sheetWeight(); break;
    case 'kp': {
      const k=v;
      if(k==='⌫'){ kpState.fresh=false; kpState.value=kpState.value.slice(0,-1); }
      else if(k==='.'){ const base=kpState.fresh?'':kpState.value; kpState.fresh=false; if(!base.includes('.')) kpState.value=(base||'0')+'.'; }
      else {
        const base=kpState.fresh?'':kpState.value; kpState.fresh=false;
        if(base.replace('.','').length<5) kpState.value=(base==='0'?'':base)+k;
      }
      kpRender();

    case 'kpQuick': kpState.value=v; kpState.fresh=false; kpRender(); break;
    case 'kpSave': {

    case 'toggle': {

function applyTheme(){
  document.documentElement.dataset.theme = DB.prefs.theme==='light'?'light':'dark';
  document.documentElement.dataset.calm = DB.prefs.calm?'1':'';
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', DB.prefs.theme==='light'?'#f4f2ec':'#0a0a09');
}
/* أرقام تتصاعد بلطف بعد كل رسم — حيوية بلا تكلفة */
function animateNums(root){
  if(DB.prefs.calm) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const els=[...root.querySelectorAll('.num')].filter(el=>el.children.length===0);
  els.forEach(el=>{
    const raw=el.textContent.trim();
    const m=raw.match(/^([\d,]{1,7})(.*)$/);
    if(!m) return;
    const target=parseInt(m[1].replace(/,/g,''),10);
    if(!isFinite(target) || target<=0 || target>999999) return;
    const suffix=m[2]||'';
    const t0=performance.now(), dur=520;
    const step=now=>{
      const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
      el.textContent=Math.round(target*e).toLocaleString('en')+suffix;
      if(p<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
function applyType(){
  const p=DB.prefs;
  document.documentElement.dataset.font=p.font||'sans';
  document.documentElement.dataset.size=p.size||'md';
}
/* إعادة فتح الإعدادات بعد تغيير (لتبقى اللوحة أمامك) */
function reOpenSettings(){
  if($('#sheet').classList.contains('on')) sheetSettings();
}

/* مضاعف النقاط حسب شكل الأثر المختار */
function xpMult(){ return DB.prefs.accent==='strict'?0.75:DB.prefs.accent==='calm'?1.25:1; }

function render(){
  const v={today:viewToday,body:viewBody,plan:viewPlan,trend:viewTrend,me:viewMe}[TAB]||viewToday;
  const wrap=$('#view');
  wrap.innerHTML=v();
  animateNums(wrap);
  // رسم الأيقونات داخل العناصر النائبة
  $$('.ni[data-ic]',wrap).forEach(s=>{ if(!s.innerHTML.trim()) s.innerHTML=ic(s.dataset.ic,'lg'); });
  upgradeInlineIcons();
  const d=new Date();
  $('#topDate').textContent=d.getDate()+' '+AR_MON[d.getMonth()];
  $('#topWeek').textContent=AR_DAYS[d.getDay()];
  const m=d.getHours()*60+d.getMinutes();
  $('#dayBar').style.transform='scaleX('+clamp(m/(24*60),0,1)+')';
  updateBell();
}
/* الأيقونات الصغيرة داخل الأزرار والعناصر التي كتبنا فيها ic() مسبقًا جاهزة،
   لكن نضيف صنف draw لأول ظهور فقط */
let drawnOnce=false;
function upgradeInlineIcons(){
  if(drawnOnce) return;
  drawnOnce=true;
  $$('#view svg.ic').forEach(s=>s.classList.add('draw'));
}
function tickClock(){
  const d=new Date(), m=d.getHours()*60+d.getMinutes();
  const b=$('#dayBar'); if(b) b.style.transform='scaleX('+clamp(m/(24*60),0,1)+')';
  if((d.getHours()===0&&d.getMinutes()===0)) render();
}

/* حركة القوس في مشهد اليوم */
(function injectKeyframes(){
  const s=document.createElement('style');

/* خلفية أولى: إذا كان الجهاز جديدًا نضيف مهامًا افتراضية مفيدة */
function seed(){
  if(DB.tasks.length) return;
  const base=[
    {title:'شرب كوب ماء',time:'08:00',icon:'drop',days:[]},
    {title:'مشي 20 دقيقة',time:'17:30',icon:'walk',days:[]},

  DB.tasks=base.map(b=>({...b,id:uid(),date:null,created:today()}));

/* ترقية: من كان لديه سجل سابق يستحق أثرًا بأثر رجعي (مرة واحدة) */
(function backfillXP(){
  if(DB.trace && DB.trace.backfilled) return;
  let xp=0;
  Object.entries(DB.days||{}).forEach(([k,d])=>{
    if(!d) return;
    xp += Math.min(6,(d.water||0))*6;
    xp += Math.min(8,Math.floor((d.steps||0)/1000))*8;
    if((d.sleep||0)>=6) xp+=10;
    xp += Object.values(d.tasks||{}).filter(Boolean).length*14;
    if(d.mood!=null) xp+=9;
  });
  xp += (DB.weights||[]).length*16;
  DB.trace.xp=(DB.trace.xp||0)+Math.min(xp,4000);
  DB.trace.level=levelOf(DB.trace.xp);
  DB.trace.backfilled=true;
  save();
})();
render(); if(!DB.prefs.onboarded) maybeOnboard();

/* شاشة البداية: تختفي بعد أول إطار — سريعة، بلا انتظار ممل */
requestAnimationFrame(()=>setTimeout(()=>{
  const sp=$('#splash'); if(sp){ sp.classList.add('gone'); setTimeout(()=>sp.remove(),700); }
},420));

/* شرر عند اللمس — خفيف جدًا، يتوقف تلقائيًا في الوضع المخفّض */
(function touchSpark(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let last=0;
  addEventListener('pointerdown',e=>{
    if(DB.prefs.calm) return;
    const now=performance.now(); if(now-last<90) return; last=now;
    const host=document.createElement('div');
    host.style.cssText='position:fixed;inset:0;z-index:98;pointer-events:none';
    document.body.appendChild(host);
    for(let i=0;i<5;i++){
      const p=document.createElement('i'); p.className='confetti';
      p.style.cssText=`left:${e.clientX}px;top:${e.clientY}px;width:3px;height:3px;border-radius:50%;opacity:.85`;
      host.appendChild(p);
      const a=Math.random()*Math.PI*2, r=14+Math.random()*20;
      p.animate([
        {transform:'translate(-50%,-50%) scale(1)',opacity:.9},
        {transform:`translate(calc(-50% + ${Math.cos(a)*r}px), calc(-50% + ${Math.sin(a)*r}px)) scale(.2)`,opacity:0}
      ],{duration:420+Math.random()*220,easing:'cubic-bezier(.22,.61,.36,1)'}).onfinish=()=>p.remove();
    }
    setTimeout(()=>host.remove(),800);
  },{passive:true});
})();

/* سطح مكتب: تحويل عجلة الفأرة إلى تنقّل بين التبويبات عند نهاية الصفحة */
(function wheelNav(){
  if(matchMedia('(pointer: coarse)').matches) return;
  const order=['today','body','plan','trend','me'];
  let lock=false;
  addEventListener('wheel',e=>{
    if(lock || !e.deltaY || e.ctrlKey) return;
    const el=document.scrollingElement;
    const atEnd=(el.scrollTop+innerHeight>=el.scrollHeight-4);
    const atTop=(el.scrollTop<=4);
    if((e.deltaY>0 && atEnd) || (e.deltaY<0 && atTop)){
      const i=order.indexOf(TAB), n=i+(e.deltaY>0?1:-1);
      if(n<0||n>=order.length) return;
      lock=true; setTimeout(()=>lock=false,700);
      document.querySelector(`#nav button[data-tab="${order[n]}"]`)?.click();
    }
  },{passive:true});
})();

/* المؤقتات: خفيفة، تتوقف عند إخفاء الصفحة */
let clockT=null, checkT=null;
function startTimers(){
  clearInterval(clockT); clearInterval(checkT);

}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ clearInterval(clockT); clearInterval(checkT); }

});

document.addEventListener('keydown',e=>{

});
